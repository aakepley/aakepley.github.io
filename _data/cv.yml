    - bullet: '**Member of NRAO Observatory Leadership Cohort II** — 10/2020 – 6/2021'
    - bullet: '**Principal Investigator for DEGAS, a large project on the Green Bank Telescope** — 2/2017 – present: Coordinate proposal writing. Develop observing procedures and manage on-call rotation. Generate requirements for data reduction pipeline. Coordinate work on data release and associated papers.'
