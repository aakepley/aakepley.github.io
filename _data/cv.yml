    Grants, Awards, and Honors:
    - bullet: '**Star Award for Work as Deputy Chair for NAASC Scientist Hiring Committee** — 11/2019'
    - bullet: '**Over 30 successful PI telescope time proposals** — 2004 – present: GBT 4mm Large Proposal (17A and 17B, high frequency oversubscription 4:1); ALMA cycle 1 proposal (top 10%, highest priority, oversubscription 6:1); 2 EVLA Resident Shared Risk Proposals (10A and 12A semesters, oversubscription 4:1)'
    - bullet: '**American Astronomical Society International Travel Grant** — 2012, 2015'
    - bullet: '**National Radio Astronomy Observatory Foreign Telescope Fund Grant** — 2009, 2010'
