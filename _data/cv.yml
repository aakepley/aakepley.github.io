    - bullet: '**Wisconsin Space Grant Consortium Graduate Fellowship** — 2003, 2007'
    - bullet: '**Karl Guthe Jansky and Alice Knapp Jansky Award** — University of Wisconsin, 2006'
    Science Management Experience:
    - bullet: '**Deputy Pipeline Sub-System Scientist for ALMA** — 1/2023 – present: Assist the Pipeline Sub-system Scientist with the management of the ALMA Pipeline Working Group. Serve as an alternate point of contact when the Pipeline Sub-system Scientist is unavailable. Write requirements for future functionality. Assist with validation.'
    - bullet: '**CASA Sub-System Scientist for ALMA** — 11/2019 – present: Gather and set ALMA requirements for CASA. Work with CASA to prioritize development. Oversee validation testing including development of automated tests for specific ALMA use cases.'
    - bullet: '**Member of NRAO Observatory Leadership Cohort II** — 10/2020 – 6/2021'
    - bullet: '**Principal Investigator for DEGAS, a large project on the Green Bank Telescope** — 2/2017 – present: Coordinate proposal writing. Develop observing procedures and manage on-call rotation. Generate requirements for data reduction pipeline. Coordinate work on data release and associated papers.'
    - bullet: '**Member of ngVLA operations working group** — 2017 – 2022: Contribute to ngVLA operations plan. Present operations plan at conferences as requested.'
    - bullet: '**Creator and maintainer of NA ARC ALMA imaging script template** — 10/2014 – 2021: Developed script to standardize manual imaging and guide data analysts in making appropriate choices.'
    Scientific Software Experience:
    - bullet: '**ALMA Wideband Sensitivity Upgrade (WSU) Data Processing** — 10/2022 – present'
    - bullet: '**Data Processing Working Group** — ALMA WSU, 10/2023 – present: Member of working group tasked with identifying requirements for an ALMA next generation Data Processing System (ngDPS) and a concept and end-to-end requirements for processing WSU data.'
    - bullet: '**Data Rate Ramp Up Working Group** — ALMA WSU, 10/2023 – present: Member of working group tasked with identifying the minimum scientific capabilities that will be offered at various stages of WSU deployment.'
    - bullet: '**Data Processing and Data Accessibility Working Group** — ALMA WSU, 10/2022 – 7/2023: Member of working group tasked with assessing the impact of the ALMA Wideband Sensitivity Upgrade (WSU) on ALMA operations and developing recommendations for WSU data processing.'
    - bullet: '**Panelist for CASA Reimplementation Program Conceptual Design Review** — 2020'
    - bullet: '**Data Reduction Pipeline for DEGAS (GBT Large Project)** — 2017 – present: Generate requirements for data reduction pipeline. Test pipeline code in production. Make bug fixes as necessary.'
    - bullet: '**Lead for "Auto-multithresh" feature** — 2016 – 2020: Developed and prototyped an algorithm to automatically mask emission while cleaning. Worked with developer to have it implemented in CASA. Led validation testing. Organized future feature development and bug fixes and did associated testing. Wrote CASA documentation and paper describing algorithm. Supervised writing of an informal guide describing how to use the feature.'
    - bullet: '**SRDP Requirements Committee** — 2017 – 2019: Provide feedback to the SRDP projects on current and future requirements.'
    - bullet: '**CASA validation** — 2012 – present'
