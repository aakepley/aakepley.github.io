# _data/cv.yml
#
# Built for the al-folio Jekyll theme's "Full CV" page format
# (https://github.com/alshedivat/al-folio), which reads this file at
# _data/cv.yml. Each top-level entry is one section of the CV page.
#
# If you're using a different Jekyll/GitHub Pages theme, the field names
# (title / type / contents / institution / year / description / items)
# may need to be adjusted to match that theme's expected schema, but the
# content below is a complete transcription of the source CV.
#
# Source: kepley_cv_full.pdf (Amanda Ann Kepley)
# Contact: National Radio Astronomy Observatory, 520 Edgemont Road,
#          Charlottesville, VA 22903-2475 | akepley@nrao.edu
#          www.kepley.us | github.com/aakepley
# Research Focus: Galaxies, star formation, magnetic fields, and the
#          interstellar medium.
# Functional Focus: Data processing pipelines, software requirements and
#          testing, imaging interferometer data.

